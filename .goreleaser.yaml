version: 2
project_name: keen
changelog:
  disable: true
builds:
  - id: keen
    main: ./cmd/keen
    binary: keen
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X keen/internal/cli.version={{ .Version }}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_amd64
      - linux_arm64
  - id: keen-mcp
    main: ./cmd/keen-mcp
    binary: keen-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_amd64
      - linux_arm64
archives:
  - formats: [tar.gz]
    # No version in the name, so releases/latest/download/<name> stays a stable URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
checksum:
  name_template: checksums.txt
nfpms:
  - id: packages
    ids: [keen, keen-mcp]
    package_name: keen
    # Like the archives: no version in the name, so the download URL stays stable.
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm]
    bindir: /usr/bin
    vendor: Imogen Labs
    homepage: https://github.com/imogenlabs/keen
    maintainer: Imogen Labs <security@imogenlabs.ai>
    description: The complete Atlassian platform CLI and MCP server.
    license: Apache-2.0
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/keen/LICENSE
      - src: README.md
        dst: /usr/share/doc/keen/README.md
