version: 2
project_name: keen
changelog:
  disable: true
builds:
  - id: keen
    main: ./cmd/keen
    binary: keen
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X keen/internal/cli.version={{ .Version }}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_amd64
      - linux_arm64
  - id: keen-mcp
    main: ./cmd/keen-mcp
    binary: keen-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_arm64
      - darwin_amd64
      - linux_amd64
      - linux_arm64
archives:
  - formats: [tar.gz]
    # No version in the name, so releases/latest/download/<name> stays a stable URL.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
checksum:
  name_template: checksums.txt
