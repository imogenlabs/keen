# Record each release in Jira.
#
# keen release sync makes the Jira version named as the tag (released, dated,
# linked to the GitHub release), adds it as a Fix Version on every KEEN issue
# the release is the first to contain (never replacing one), and turns the
# unreleased "next" version into the tag. It is safe to re-run.
#
# It runs on the tag push, not on release.published: a release published with
# the workflow's own GITHUB_TOKEN starts no other workflow.
#
# It needs three repository secrets: JIRA_BASE_URL, JIRA_USER, JIRA_API_TOKEN.
# Without them this job fails and says CANNOT RECORD, with the command to run
# by hand from a machine where keen is configured. The secrets are given only
# to the two steps that use them, never to a third-party action.
#
# keen is built from this repository at github.sha: the tag's own commit on a
# tag push, and the head of the dispatching branch on a manual run, so an old
# tag can still be recorded by a keen that has `release sync`.
name: Jira release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to record
        required: true

permissions:
  contents: read

jobs:
  jira:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Jira credentials are present
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "::error::CANNOT RECORD $TAG in Jira: this repository has no JIRA_BASE_URL / JIRA_USER / JIRA_API_TOKEN secrets. Run by hand: keen release sync --repo-path . --project KEEN --tag $TAG --head origin/main"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .keen-src
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .keen-src/go.mod
          cache: false
      - name: Build keen
        run: cd .keen-src && go build -o "$RUNNER_TEMP/keen" ./cmd/keen
      - name: Record ${{ env.TAG }} in Jira
        env:
          JIRA_CLOUD_PLATFORM_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_CLOUD_PLATFORM_USERNAME: ${{ secrets.JIRA_USER }}
          JIRA_CLOUD_PLATFORM_PASSWORD: ${{ secrets.JIRA_API_TOKEN }}
        run: >-
          "$RUNNER_TEMP/keen" release sync --repo-path . --project KEEN
          --tag "$TAG" --head origin/main --github-repo imogenlabs/keen

