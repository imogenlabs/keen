name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Build
        run: |
          go build -o bin/keen ./cmd/keen/
          go build -o bin/keen-mcp ./cmd/keen-mcp/

      - name: Test
        run: go test ./...

      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/keen/
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/keen-mcp/

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # A snapshot never publishes; it loads one image per platform, tagged -amd64 and -arm64.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --snapshot --clean --parallelism 2

      - name: Packages hold keen and keen-mcp
        run: |
          command -v rpm >/dev/null || sudo apt-get install -y -qq rpm
          for arch in amd64 arm64; do
            dpkg-deb -c "dist/keen_linux_$arch.deb" | tee /dev/stderr | grep -q ' ./usr/bin/keen-mcp$'
            dpkg-deb -c "dist/keen_linux_$arch.deb" | grep -q ' ./usr/bin/keen$'
            rpm -qlp "dist/keen_linux_$arch.rpm" | tee /dev/stderr | grep -qx /usr/bin/keen-mcp
            rpm -qlp "dist/keen_linux_$arch.rpm" | grep -qx /usr/bin/keen
          done

      - name: Both architectures have an image
        run: |
          docker image ls ghcr.io/imogenlabs/keen
          docker image ls smashingtags/keen --format '{{.Tag}}' | grep -q -- '-arm64$'

      - name: Packages install with apt and dnf, and the image answers MCP
        run: scripts/ci/install-tests.sh
