name: tmp bundle test
on: pull_request
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v1.8.0
      PUBLISHER: v1.8.7
      PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle steps from release.yml, without upload or publish
        run: |
          mkdir -p dist/arm64 dist/amd64
          gh release download "$TAG" -p keen_darwin_arm64.tar.gz -p keen_darwin_amd64.tar.gz -D dist
          tar xzf dist/keen_darwin_arm64.tar.gz -C dist/arm64
          tar xzf dist/keen_darwin_amd64.tar.gz -C dist/amd64
          command -v llvm-lipo >/dev/null || sudo apt-get install -y -qq llvm >/dev/null
          llvm-lipo -create -output dist/keen-mcp dist/arm64/*/keen-mcp dist/amd64/*/keen-mcp
          info=$(llvm-lipo -info dist/keen-mcp) && echo "$info" && grep -qw x86_64 <<<"$info" && grep -qw arm64 <<<"$info"
          python3 scripts/mcp-registry.py dist/keen-mcp "$TAG" dist/registry
          ls -la dist/registry
          curl -fsSL -o publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c
          tar xzf publisher.tar.gz mcp-publisher && ./mcp-publisher --help | head -3
