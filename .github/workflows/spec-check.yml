name: Atlassian spec check

# Weekly: compare Atlassian's current API specs with the copies keen was built
# from (specs/). When any differ, open one issue listing what changed, or update
# the open one. Applying the change is one local run of scripts/regen/regen.sh.

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare specs
        id: diff
        run: |
          set +e
          python3 scripts/regen/specdiff.py > diff.md
          status=$?
          set -e
          cat diff.md
          [ "$status" -le 1 ] || exit "$status"
          echo "changed=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Atlassian changed the API specs keen is built from
        run: |
          {
            echo "Atlassian's published specs no longer match the copies in \`specs/\`."
            echo
            cat diff.md
            echo "To bring keen up to date, on a fresh branch:"
            echo
            echo '```'
            echo 'scripts/regen/regen.sh'
            echo 'scripts/regen/check.sh'
            echo '```'
            echo
            echo "See README, Regeneration. This issue updates itself each week until the specs match."
          } > body.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
